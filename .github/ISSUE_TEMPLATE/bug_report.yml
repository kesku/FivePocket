name: Bug report
description: Something in FivePocket does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach** disc images, bundles, the .ipa you built, files from the app's game folder, shader or
        pipeline caches, saves or memory dumps, and do not paste hex of game data. A plain log and a screenshot are
        enough. You can also report in the #bug-reports forum on the [FivePocket Discord](https://discord.gg/mZvqCsxgxT).
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [FivePocket Duo, "Duo Builder (macOS)"]
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, description: "The About page of the app, or the version in the builder download's README.txt", placeholder: 1.1.0-alpha.1}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Device and system, placeholder: "iPhone Duo, iOS version / Mac model, macOS and Xcode version"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: What you did, what you expected and what you saw.}
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Builder: the --report file. Duo: the crash report from Settings > Privacy & Security > Analytics & Improvements > Analytics Data. Details in docs/TROUBLESHOOTING.md. Paste text; no attachments of game files."
      render: text
  - type: checkboxes
    id: clean
    attributes:
      label: Clean report
      options:
        - label: I attached no game files, bundles, caches, saves or memory dumps.
          required: true
